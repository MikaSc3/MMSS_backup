  monopart_analysis_task_v2:
    text: |
      Analyze this individual mechanical part from 3D renderings and metadata to assess its properties and automation potential.
      
      You will receive:
      - Multiple images of the SAME part (different views: top, isometric, etc.)
      - Optional JSON Metadata (stepparser part data: volume, bounding_box, etc.)
      - Optional Assembly Context (assembly overview from prior analysis)
      
      Return ONE unified analysis for the part, based on ALL images and metadata.
      
      Answer the following questions:
      - Identify the part based on its function within the assembly. Speculate on what the part does in the assembly.
      - Come up with a suitable name for the part
      - Reason about the parts material and the materials properies 
      - Give a final one word answer: What is the most likely material for the part in the assembly context?
      - Whats the density of the material?
      - Whats the weight of the part?
      - Think about how such a part should be packaged in an efficient industrial environment? Here are some common packaging strategies:
        - "magazine (defined position and orientation)": Each part is placed individually, with an exactly known position.
          - example: Shafts or rod-like parts with bearing-like function that would fall over without support and would roll away without inlays, gears, and high-precision parts that need to be protected.
        - "magazine (undefined position or orientation)": Parts are ordered, but twisted or not positionally fixed.
          - example: Medium to large milled parts such as flanges and housings.
        - "magazine (packaging problem: individual packaging or sticky intermediate layer)": Parts are packed individually or stick to separating foils – difficult to remove.
          - example: Rolling bearings.
        - "magazine (with non-sticky intermediate layer)": Layers are separated, but not stuck (parts stacked in several layers, separated by cardboard).
          - example: Medium to large milled parts such as flanges and housings that can be stacked.
        - "bulk (easily automatable: e.g. vibratory feeder)": Unordered, easy to separate, no risk of entanglement. Parts must be suitable for vibratory feeding. Vibratory feeders only for parts <50x50x50mm.
          - example: Screws, nuts, bolts.
        - "bulk (bin picking automatable)": Unordered, but can be picked with a 3D camera, no risk of entanglement.
          - example: Small milled or turned parts without risk of entanglement and without function-critical surfaces.
        - "bulk (not automatable: e.g. entanglement)": Parts get entangled or knotted.
          - example: Standard springs and small parts in high quantities, often sheet metal or bent parts with latching tabs, retaining rings.
      - Describe the geometric features of the part as precise as possible
      - List the functional surfaces of the part 
          description: describe the surface on a makro level
          name: give it a name 
          position: where is the surface on the part?
          size: Is the surface small, medium or large based on the total part size?
          chamfers: "Are chamfers present at the ends of the surface?" (Yes or No)
          endstops: "Are endstops present at the ends of the surface?" (Yes or No)
          suitable_for_gripping_reasoning: Is the surface suitable for gripping and handling the part? Think about if the surface might interfere in an assembly process.
          suitable_for_gripping: Is this surface suitable for gripping? (Yes or No)
       - Choose the most suitable characteristic for the part (options might be "fully rotational symmetric", "rotational symmetric with single features", "prismatic", "boxy", "complex geometry", "freeform") 
       - Where would you grip the part? give at least 2 options and talk about grip stability. Important: only choose surfaces which are non functional and are not blocked in an assembly context by other parts (e.g. bearing shouldnt be gripped on the inside if it is mounted on a shaft)
      === OUTPUT FORMAT ===
      Return structured JSON following the SinglePartAnalysis schema.
 
      part_identification: str = Field(description="What is the parts task within the assembly?")
      part_name_guess: str = Field(description="name that suits the displayed part")
      material_reasoning: str = Field(description="Material identification and properties")
      material_word: str = Field(description = "Material (e.g. Aluminium, PLA, ...)")
      density: float = Field(description = "Density of Material")
      weight: float = Field (description = "Weight of the part based on volume and density in gramms")
      packaging_info: str = Field(description="Suitable Packaging")
      geometry_description: str = Field(description="Detailed geometric analysis")
      functional_surfaces: List[Surface]
      part_charateristics: str
      gripping_description: str = Field(description="Where part can be gripped?")


