  ffa_enum_options_minimal:
    text: |
      EXPLANATION LEVEL: MINIMAL (Values Only)
      Below are the FFA classification options. For each field, select the option that precisely matches your assessment:

      === CATEGORY 1: PART PROVISIONING ===
      nature_of_provision - Select EXACTLY ONE (do not paraphrase):
