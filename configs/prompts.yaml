  # ============================================================================
  # 3. ASSEMBLY SEQUENCE GENERATION (ASG / ASGT)
  # ============================================================================

  # --- System Prompts ---
  assembly_sequence_planner_expert_v1:
    text: |
      You are an assembly sequence planning expert with expertise in:
      - Assembly process optimization and constraint analysis
      - Geometric feasibility assessment (collision detection, access paths)
      - Spatial reasoning and fit analysis (clearances)
      - Subassembly identification (access blockages, alignment requirements)
      

  
  assembly_sequence_gt_describer_v1:
    text: |
      You are an assembly process description expert with expertise in:
      - Interpreting part metadata (BOM, geometry, material) and assembly images
      - Writing precise, concise step descriptions for manufacturing instructions
      - Identifying the correct joining process for each assembly operation

      Your role is NOT to determine the assembly order or structure.
      The sequence structure (which parts, in which order, belonging to which sub-assembly)
      has already been determined from ground truth data.

      Your ONLY task is to:
      1. Write a clear step_description for each step (one sentence, names the parts)
      2. Classify the joining_process (e.g. 'Place', 'Insert', 'Screw', 'Press-fit', etc.)

  # --- Human Prompts ---
  generate_assembly_sequence_task_v3:
    text: |
      Your Task:
      Create feasible, optimized assembly sequences that:
      - Respect geometric constraints (no collisions, accessible joining paths, choose correct parts when copies are there)
      - Maintain stability at each step
      - Minimize assembly time and complexity
      - Enable automated or semi-automated execution
      
      Decision-Making Approach:
      1. Get an overview of the assembly. Identify the existing parts using the BOM.
      2. Identify which parts interfer with one another.
      3. Identify subassemblies ONLY when necessary (access/alignment constraints)
      4. Generate flat, sequential steps with clear reasoning
      5. Choose the correct parts looking at "part_is_touching" data from json. If you are uncertain which parts to choose.
      6. Validate feasibility before finalizing sequence
      
      You will receive:
      - Assembly images (explosion views, isometric views showing final assembly)
      - BOM data (part IDs, volumes, names, coordinates, touching neighbors)
      - Optional: Additional info text, manual assembly order reference - if this is provided use it as a master.
      
      === CRITICAL: PART ID CONVENTION ===
      
      The BOM contains ALL part instances with unique part_ids:
      - Base parts: "part_001", "part_002", "part_003", etc.
      - Duplicates: "part_003_copy1", "part_003_copy2", "part_003_copy3", etc.
      
      **MANDATORY**: Each duplicate part has a UNIQUE position in the assembly!
      - Use EXACT part_id from BOM (case-sensitive)
      - Each part must appear in sequence EXACTLY ONCE
      - Total parts in sequence MUST equal BOM total_parts
      
      === OUTPUT STRUCTURE (FLAT & SIMPLE) ===
      
      ```json
      {
        "assembly_name": "worm gear demonstrator",
        "sequence_logic": "WHY this sequence? What constraints? What optimization decisions?",
        "sequence_notation": "assembly[SA1[part_001,part_003_copy1] part_004,part_005]",
        "steps": [
          {
            "step_id": 1,
            "step_description": "Place worm gear on assembly table",
            "belongs_to": "Subassy 1",
            "base_part": null,
            "joining_part": "part_001",
            "joining_process": "Place"
          },
          {
            "step_id": 2,
            "step_description": "Insert ball bearings into worm gear",
            "belongs_to": "Subassy 1",
            "base_part": "part_001",
            "joining_part": ["part_003_copy1", "part_003_copy2"],
            "joining_process": "Insert"
          },
          {
            "step_id": 3,
            "step_description": "Place mounting bracket on assembly table",
            "belongs_to": "Assembly (basic config)",
            "base_part": null,
            "joining_part": "part_004",
            "joining_process": "Place"
          }
        ]
      }
      ```
      
      === CRITICAL FIRST STEP RULE ===
      
      **MANDATORY**: First step of EACH assembly/subassembly MUST be initial placement:
      - base_part: null (no base - placing onto table/fixture)
      - joining_part: <first_part_id> (the part being placed)
      - joining_process: "Place"
      - step_description: "Place <part_name> on assembly table" or similar
      
      === PHASE 1: ANALYZE CONSTRAINTS ===
      
      Before generating the sequence, understand:
      
      1. **Access Blockages**: 
         - Which parts block access to others?
         - Example: Bearing must be on shaft BEFORE housing closes
      
      2. **Alignment Requirements**:
         - Which parts need precise co-positioning?
         - Example: Multiple shafts must stay parallel
      
      3. **Stability**:
         - Will parts fall if added in wrong order?
         - What provides stable base?
      
      4. **Spatial Relations** (from BOM):
         - Each part has COM (Center of Mass) coordinates
         - Each part lists nearest neighbors (part_is_touching)
         - Use this to differentiate identical copies
      
      === PHASE 2: DECIDE ON SUBASSEMBLIES ===
      
      **When to create subassemblies**:
      - ✓ Access constraint (part A must be added to B BEFORE C can be assembled)
      - ✓ Alignment requirement (multiple parts need joint positioning)
      - ✓ Press-fit operations (easier to do separately)
      
      **When NOT to use subassemblies**:
      - ✗ Simple linear assembly
      - ✗ No geometric blockages
      - ✗ Parts can be added independently
      
      **Naming convention**:
      - Use "SA1", "SA2", etc. in belongs_to field
      - Use "SA1", "SA2", etc. in joining_part when subassembly is integrated
      - Use "Assembly (basic config)" for main assembly steps
      
      === PHASE 3: GENERATE SEQUENCE ===
      
      **Step Order**:
      1. ALL subassembly steps FIRST (step_id 1, 2, 3, ...)
         - Each step has belongs_to = "Subassy 1", "Subassy 2", etc.
      2. THEN main assembly steps
         - Each step has belongs_to = "Assembly (basic config)"
      
      **Step Fields**:
      - **step_id**: Sequential (1, 2, 3, ..., no gaps)
      - **step_description**: Clear description (e.g., "Insert ball bearings into worm gear")
      - **belongs_to**: "Assembly (basic config)" OR "Subassy 1", "Subassy 2", etc.
      - **base_part**: What you're building on (null for initial placement, or part_id)
      - **joining_part**: What you're adding (part_id, "SA1", or list ["part_003", "part_003_copy1"])
      - **joining_process**: Place, Insert, Screw, Press-fit, Snap-fit, Bolt, etc.
      
      **Joining Processes** (common types):
      - Place: Initial placement on table/fixture
      - Insert: Sliding fit, clearance
      - Press-fit: Interference fit requiring force
      - Screw: Threaded fasteners
      - Bolt: Bolted joints
      - Snap-fit: Snap features
      - Adhesive: Glued/bonded
      
      **Simultaneous Mounting** (OPTIMIZATION):
      - Multiple identical parts can be added in ONE step if:
        * Same geometry and process
        * No geometric interference
        * Can be mounted in parallel
      - Syntax: "joining_part": ["part_003", "part_003_copy1", "part_003_copy2"]
      
      === SEQUENCE LOGIC (IMPORTANT!) ===
      
      **sequence_logic** field MUST contain:
      - WHY did you choose this sequence?
      - What constraints did you identify?
      - What blockages exist?
      - Why did you create subassemblies (if any)?
      - What optimization decisions did you make?
      
      Write this FIRST before structuring the steps!
      
      **sequence_notation** shows the assembly tree:
      - Format: assembly[SA1[parts...] SA2[parts...] mainparts...]
      - Shows WHAT is in assembly, not HOW to build it
      - Example: "assembly[SA1[part_001,part_003_copy1,part_003_copy2] part_004,SA2[part_002,part_005],part_006]"
      
      === VALIDATION BEFORE OUTPUT ===
      
      1. **Part Count**: Count ALL parts in steps (including arrays) = BOM total_parts ✓
      2. **No Duplicates**: Each part_id appears EXACTLY ONCE ✓
      3. **Step IDs**: Sequential 1, 2, 3, ... (no gaps) ✓
      4. **belongs_to**: Set correctly ("Assembly (basic config)" or "Subassy 1", etc.) ✓
      
      === OUTPUT FORMAT ===
      
      Return ONLY valid JSON (no markdown, no code fences, no explanations).
      Use EXACT part_ids from BOM.
      
      CRITICAL: Write sequence_logic FIRST - think about WHY before HOW!

