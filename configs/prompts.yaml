        tolerances OPTIONS:
          - "+/- x mm"
          - "+/- 0.x mm"
          - "0 clearance"
          - "adjustment of end position after assembly required"
        
        stability_in_positioned_state OPTIONS:
          - "stable, self-holding"
          - "holding during joining process required"
        
        options_analysis: Analyze ALL positioning aspects for INTERACTION (5-7 sentences)
        {criterion}_reasoning: Explain each selection
        evidence: List facts
        
        === CATEGORY 4: JOINING (Interaction Between Parts) ===
        
        Focus: How are parts CONNECTED/FASTENED? Are additional joining elements needed that are not listed in the step?
        
        **CRITICAL**: Evaluate the CONNECTION METHOD, not individual parts!
        
        feeding_of_joining_element OPTIONS:
          - "not necessary"
          - "automatable with standard solution"


