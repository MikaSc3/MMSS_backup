  ffa_assessment_task_v2_with_explanation:
    text: |
      Assess this assembly step across 4 key "Fitness for Automation" (FFA) categories.
      
      You will receive:
      1. Assembly step information (step description, base part, joining part, joining process)
      2. Metadata for base and joining parts (geometry, material, features)
      3. Multiple renderings: PRIOR step (assembly state BEFORE) + CURRENT step (assembly state AFTER)

      === CATEGORY 1: PART PROVISIONING ===
      nature_of_provision OPTIONS:
        - "magazine (defined position and orientation)": Each part is placed individually, with an exactly known position.
        - "magazine (undefined position or orientation)": Parts are ordered, but twisted or not positionally fixed.
        - "magazine (packaging problem: individual packaging or sticky intermediate layer)": Parts are packed individually or stick to separating foils – difficult to remove.
        - "magazine (with non-sticky intermediate layer)": Layers are separated, but not stuck (parts stacked in several layers, separated by cardboard).
        - "bulk (easily automatable: e.g. vibratory feeder)": Unordered, easy to separate, no risk of entanglement. Parts must be suitable for vibratory feeding. Vibratory feeders only for parts <50x50x50mm.
        - "bulk (bin picking automatable)": Unordered, but can be picked with a 3D camera, no risk of entanglement.
        - "bulk (not automatable: e.g. entanglement)": Parts get entangled or knotted.

      === CATEGORY 2: PART HANDLING ===
      part_rigidity OPTIONS:
        - "rigid": No deformation when gripping.
        - "elastic": Yields, but returns to original shape.
        - "limp": Loses shape, buckles.
      gripping_areas OPTIONS:
        - "pronounced gripping areas present": Large surfaces or edges.
        - "small gripping areas present": Small surfaces or edges.
        - "no gripping areas present": No surfaces.
      orientation_features OPTIONS:
        - "self-alignment when gripper closes": Geometry enforces correct position in the gripper.
        - "gripping based on part position detection required": Gripper must be adjusted to the current orientation of the part before gripping.
        - "additional alignment station required": Vision solution is not sufficient or not possible. Mechanical alignment station defines the position before gripping.
        - "no orientation features": No mechanical features for orientation present.
      surface_sensitivity OPTIONS:
        - "insensitive": Mechanically robust.
        - "scratch, break, shape sensitive": Very sensitive.

      === CATEGORY 3: JOINING LOCATION ===
      accuracy_of_target_position OPTIONS:
        - "base part positioning defined / joining location defined": Base part in fixture (repeatable), joining position repeatably defined.
        - "base part positioning defined / joining location tolerance": Base part in fixture (repeatable), joining position varies.
        - "base part positioning tolerance / joining location defined": Base part positioned via joining position in fixture, rotates freely around position.
        - "base part positioning tolerance / joining location tolerance": No fixture possible. Everything varies.
      positioning_aids OPTIONS:
        - "insertion chamfers and end stops present": Base and joining part have at least one end stop and one insertion chamfer.
        - "insertion chamfers present": Base and joining part have at least one insertion chamfer.
        - "end stops present": Base and joining part have at least one end stop.
        - "no positioning aids present": Free joining.
      additional_orientation_by_rotation OPTIONS:
        - "not required": Orientation does not matter.
        - "mechanical guidance": Position controlled by gripper.
        - "optical information required": Positioning of the joining part must be based on optical information of the joining or base part.
        - "required but not feasible": Positioning must be based on optical information, but not possible (not visible, measurable, etc.).
      accessibility_to_joining_position OPTIONS:
        - "visibility and tool clearance given": Ideal case, location visible and accessible.
        - "no visibility / tool clearance given": Blind assembly, location accessible, not visible.
        - "visibility given / no tool clearance": Location visible, but not accessible with gripper/tool.
        - "no visibility / no tool clearance": Not visible, not accessible with gripper/tool.
      joining_motion OPTIONS:
        - "linear joining motion": One-dimensional movement.
        - "path movement required": Curved or at least 2D movement (screwing would be 2D - linear + rotation).
        - "sensor guided (linear/path)": Force/path control or monitoring.
      joining_tolerances OPTIONS:
        - "+/- x mm": Large clearance.
        - "+/- 0.x mm": Precise fit.
        - "zero clearance": Press fit.
        - "adjustment of end position after assembly required": Adjustment necessary.
      stability_in_positioned_state OPTIONS:
        - "stable, self-holding": Part can be released after positioning/joining. Form or force fit holds parts.
        - "holding during joining process required": Part must be held in end position.

      === CATEGORY 4: JOINING PROCESS ===
      feeding_of_joining_element OPTIONS:
        - "not necessary": No additional parts required for the process.
        - "automatable with standard solution": Additional standard component (not present in step) required.
        - "restricted feeding (e.g. accessibility)": Additional standard component (not present in step) required, but difficult to feed automatically.
        - "automatable with special development": Special geometry of rivets, screws, etc.
        - "special development, not foreseeable": Experimental process.
      fixing_of_mounted_part OPTIONS:
        - "automatable with standard solution": Standard screw spindle, pressing in.
        - "automatable with special development": Special screws, gluing, fitting retaining rings.
        - "special development, not foreseeable": Experimental process.

  ffa_assessment_task_v3_with_explanation_examples_guidelines:
    text: |
      Assess this assembly step across 4 key "Fitness for Automation" (FFA) categories.
      Assess the following assembly step according to the predefined “Fitness for Automation” (FFA) categories and their options.

      You are provided with:
      Assembly step information
      Step description
      Base part
      Joining part
      Joining process

      Metadata for base and joining parts 
      A comprehensive Interactionanalysis of the interaction between base and joining part.

      You are also provided with explanation and examples for each category and its options.
      Use these examples to choose an appropriate option.

      === CATEGORY 1: PART PROVISIONING ===
      nature_of_provision OPTIONS:
        - "magazine (defined position and orientation)": Each part is placed individually, with an exactly known position. Applicable to parts that need to be protected.
          - example: Shafts or rod-like parts with bearing-like function that would fall over without support and would roll away without inlays, gears, and high-precision parts that need to be protected.
        - "magazine (undefined position or orientation)": Parts are ordered, but twisted or not positionally fixed. For parts that to not reqiure additional protection but are not suitable for bulk either.
          - example: Medium to large milled parts such as flanges and housings.
        - "magazine (packaging problem: individual packaging or sticky intermediate layer)": Parts are packed individually or stick to separating foils to protect them or lubricate them.
          - example: Roller bearings.
        - "magazine (with non-sticky intermediate layer)": Applicable for parts which can be stacked in multiple layers.Layers are separated by cardboard.
          - example: Medium to large milled parts such as flanges and housings that can be stacked.
        - "bulk (easily automatable: e.g. vibratory feeder)": Unordered, easy to separate, no risk of entanglement. Parts must be suitable for vibratory feeding. Vibratory feeders only for parts <50x50x50mm.
          - example: Screws, nuts, bolts, hexagonal nuts
        - "bulk (bin picking automatable)": Unordered, but can be picked with a 3D camera, no risk of entanglement. Applicable if parts do not require additional protection.
          - example: Small milled or turned parts without risk of entanglement and without function-critical surfaces.
        - "bulk (not automatable: e.g. entanglement)": Applicable when parts can entangled in bulk but magazined provision is unlikely due to part geometry or packaging costs.
          - example: Standard springs and small parts in high quantities, often sheet metal or bent parts with latching tabs, retaining rings.

        Guidelines: IMPORTANT: The part must be suitable for the provision option. These guidelines are there if you are uncertain.
        - Use bulk over magazined (cost and place effective)
        - Use vibration feed over bin picking (easier to automate)

        After this we can assume: 
        - The part is seperated from the bulk/cargo it was delivered in. 
        - But: We still do not know its position / Orientation 
        - If the parts are delivered in magazine (all variants) we can assume the parts orientation is defined but the position is not known (e.g. Basepart is placed on its bottom surface but we dont know its precise position or rotation)
        - If the parts are seperated by bin picking we either need camera or alignment station based on the parts geometry to pick it correctly.
        - In Case of Vibration feed we can assume the part is not only seperated but in a defined orientation and position
        - In case of not automatable: we can assume a human operator has placed the parts in an alignment station.
        - Important for evaluating the next category.

      === CATEGORY 2: PART HANDLING ===
      part_rigidity OPTIONS:
        - "rigid": No deformation when gripping.
          - example: Most industrial parts made of thermoplastics or metal.
        - "elastic": Yields, but returns to original shape.
          - example: Elastomers, O-rings.
        - "limp": Loses shape, buckles.
          - example: Cables, foils, thin, large sheet metal parts.

      gripping_areas OPTIONS:
        - "pronounced gripping areas present": Large surfaces or edges.
          - example: Medium to large milled parts such as flanges and housings with permissible gripping surfaces and edges that are not functional surfaces.
        - "small gripping areas present": When part has small surfaces or edges. (bbox <20 mm or fractioned surfaces)
          - example: Small parts (nuts and screws) with limited areas 
        - "no gripping areas present": No surfaces.
          - example: Countersunk screws, retaining rings (no suitable gripping surfaces).

      orientation_features OPTIONS:
        - "self-alignment when gripper closes": Geometry enforces correct position in the gripper when closing.
          - example: Fully rotationally symmetric parts. Bearings, rods, Or when whe handle a subassembly that is placed on the assembly table (nature of provision 1)
        - "gripping based on part position detection required": Gripper must be adjusted to the current orientation of the part before gripping due to single features that position must be know before gripping.
          - example: Rotationally symmetric parts with keyway. Housings, Flanges. Actual position of the part or features must be known (edges, holes, ..) to securely grip the part.
        - "additional alignment station required": Vision solution is not sufficient or not possible. Mechanical alignment station defines the position before gripping.
          - example: Rotationally symmetric parts with keyway. Part is put on a orientation station where the key is matching the geometry of the fixture. When a gripper now takes the part we know its position! Also: Often used when vibration feeding or bin picking is used so part can be calibrated.
        - "no orientation features": No mechanical features for orientation present.

      surface_sensitivity OPTIONS:
        - "insensitive": Mechanically robust.
          - example: Rotationally symmetric parts made of metal, housings.
        - "scratch, break, shape sensitive": Very sensitive.
          - example: Displays

      After this we can assume:
      - The part is secure in a gripper or a hand of an operator. Important for evaluating the next category.


      === CATEGORY 3: JOINING LOCATION ===
      Notes: When placing the first part of the assembly (only joining part, no base part) we need to assume that the part is put in a fixture with chamfers and endstops
        After the part is positioned it is held by the fixture. So even if the joining part does not have chamfers and endstops, we can assume that is done by the fixture.

      accuracy_of_target_position OPTIONS:
        - "base part positioning defined / joining location defined": Base part in fixture (repeatable), joining position repeatably defined.
          - example: Placing the first parts in a fixture: housing in fixture, all joining positions defined. Applies to most cases!
        - "base part positioning defined / joining location tolerance": Base part in fixture (repeatable), joining position of other features varies. 
          - example: The rotational basepart with a hole is placed in a fixture, now we add a pin to the Baseparts hole. We do not know where the hole is located at. 
        - "base part positioning tolerance / joining location defined": Base part positioned via joining position in fixture, rotates freely around position.
          - example: The base parts fixture uses the hole (later joining position) to fix the part. Geometries around are having tolerances.
        - "base part positioning tolerance / joining location tolerance": In Case no fixture possible. Everything varies.
      positioning_aids OPTIONS:
        - "insertion chamfers and end stops present": Base and joining part have at least one end stop and one insertion chamfer. Always applies to positioning the first part of an assembly or subassembly.
          - example: Bearing on shaft (shaft with insertion chamfer and end stop for bearing).
        - "insertion chamfers present": Base and joining part have at least one insertion chamfer.
          - example: Bearing on shaft (shaft with insertion chamfer, constant diameter – no end stop).
        - "end stops present": Base and joining part have at least one end stop.
          - example: Bearing on shaft (shaft with end stop for bearing, no insertion chamfer).
        - "no positioning aids present": Free joining.
          - example: Bearing on shaft – no insertion chamfer, no end stop.
      additional_orientation_by_rotation OPTIONS:
        - "not required": Orientation does not matter.
          - example: Rotationally symmetric pin in bore. 
        - "mechanical guidance": Position controlled by gripper.
          - example: Place rectangular shaft in a rectangular cutout in the base part (position of shaft hole must be ensured by rotation). Screwing
        - "optical information required": Positioning of the joining part must be based on optical information of the joining or base part.
          - example: Features of two parts must be detected by vision and matched (retaining pin must go into keyway of a rotational shaft. The position of the keyway varies). First: Orientation / Location of the hole must be identified. Then pin target position can be adjusted.
        - "required but not feasible": Positioning must be based on optical information, but not possible (not visible, measurable, etc.).
          - example: Features of two parts must be detected and matched (retaining pin must go into keyway of shaft, but keyway position not repeatable) – but not possible due to gripper blocking visibility or smt else / features to small
      accessibility_to_joining_position OPTIONS: Image you would stand in front of the assembly.  
        - "visibility and tool clearance given": Ideal case, location visible and accessible.
          - example: Free assembly area. Placing a part in a fixture. 
        - "no visibility / tool clearance given": Blind assembly, location accessible, not visible.
          - example: Internal screw connection. Inserting components deeply in other ones. 
        - "visibility given / no tool clearance": Location visible, but not accessible with gripper/tool.
          - example: Screw connection near housing wall (no accessibility for socket).
        - "no visibility / no tool clearance": Not visible, not accessible with gripper/tool.
          - example: Screw connection under cable.
      joining_motion OPTIONS: Meant is the final movement when placing the part in its final position.
        - "linear joining motion": One-dimensional movement.
          - example: Linear motion to but a basepart in a fixture.
        - "path movement required": Curved or at least 2D movement (screwing would be 2D - linear + rotation).
          - example: Screwing, 
        - "sensor guided (linear/path)": Force/path control or monitoring.
          - example: Pressing processes
      joining_tolerances OPTIONS:
        - "+/- x mm": Large clearance. +- 1.0mm
          - example: For large assemblies and devices or parts with low precision requirements.
        - "+/- 0.x mm": Precise fit.
          - example: For most part pairings (spacer sleeve on shaft, parts placed in fixtures).
        - "zero clearance": Press fit.
          - example: Bearing on shaft, threaded inserts in housing.
        - "adjustment of end position after assembly required": Adjustment necessary.
          - example: Spring-loaded elements.
      stability_in_positioned_state OPTIONS:
        - "stable, self-holding": Part can be released after positioning/joining. Form or force fit holds parts.
          - example: Pressed-in elements, spacer sleeve threaded onto shaft.
        - "holding during joining process required": Part must be held in end position.

      === CATEGORY 4: JOINING PROCESS ===
      feeding_of_joining_element OPTIONS:
        - "not necessary": No additional parts required for the process.
          - example: Most cases.
        - "automatable with standard solution": Additional standard component (not present in step) required.
          - example: Adhesive, lubricant, etc., rivets.
        - "restricted feeding (e.g. accessibility)": Additional standard component (not present in step) required, but difficult to feed automatically.
          - example: Adhesive, lubricant, etc., rivets.
        - "automatable with special development": Special geometry of rivets, screws, etc.
          - example: Special shapes of rivets, screws, etc.
        - "special development, not foreseeable": Experimental process.
      fixing_of_mounted_part OPTIONS:
        - "automatable with standard solution": Standard screw spindle, pressing in.
          - example: Standard screw connection, pressing in.
        - "automatable with special development": Special screws, gluing, fitting retaining rings.
          - example: Special screws, gluing, fitting retaining rings.
        - "special development, not foreseeable": Experimental process.
          - example: Experimental process.


      Instructions:
      - Evaluate this specific step only.
      - Base all decisions strictly provided data and renderings (if provided)
      - Maintain logical consistency across all four FFA categories.
      - Select exactly one predefined option for each listed field based on the provided data.
      - Output only the selected option strings.

### Application Prompts
  
  # ─── AGENT 1: Assembly Analyst ──────────────────────────────────────────
  agent1_system: |
    You are an experienced mechanical engineering expert specializing in assembly structure analysis.
    Your role is to analyze CAD assemblies and provide comprehensive insights about their structure,
    constraints, and assembly feasibility.
    
    Be thorough but concise. Focus on actionable insights that will help guide the assembly sequence generation.
    
    ## IMPORTANT: Multi-Turn Conversation Protocol
    1. **First Response**: Analyze the assembly and provide initial insights (3 sentences + function statement)
    2. **Wait for User Questions**: The user will ask questions or provide feedback
    3. **Answer Thoroughly**: Address each user question with relevant technical details
    4. **Decide When Ready**: Only after engaging with the user AND gathering sufficient insights, 
       call the continue_process() tool to signal you are ready for the next phase
    
    CRITICAL: Do NOT call continue_process() on your first response. 
    Always wait for at least one user interaction before deciding to proceed.
  
  agent1_user: |
    Please analyze the following assembly: **{assembly_name}**
    
    ## Assembly Metadata
    ```json
    {assembly_metadata}
    ```
    
    ## Your Task
    1. **Structure Summary**: Describe the assembly structure in 2-3 sentences (part count, type, main components)
    2. **Key Constraints**: List 3-5 assembly constraints or challenges (tolerances, fragility, dependencies)
    3. **Critical Interactions**: Identify part pairs that have tight dependencies or critical interfaces
    4. **Recommended Analysis Images**: Which rendered views would be most helpful (iso, exploded, section)
    5. **Assumptions & Concerns**: Note any unknowns or potential risks for automation
    
    Format your response as plain text with clear section headers.

  # ─── AGENT 2: Sequence Validator ───────────────────────────────────────
  agent2_system: |
    You are a manufacturing process engineer validating assembly sequences.
    
    ## CORE INSTRUCTIONS
    
    **FIRST RESPONSE RULE (CRITICAL)**: 
    On your FIRST response (when you see the sequence for the first time):
    - Present the sequence step-by-step in clear language
    - Highlight any issues, concerns, or areas that need clarification
    - Ask the user: "Does this look correct to you, or would you like to make any changes?"
    - DO NOT call any tools on this first response
    - WAIT for the user to provide feedback
    
    **SUBSEQUENT RESPONSES**:
    - Only after the user provides feedback, use tools to act
    - If user approves: call approve_sequence()
    - If user suggests changes: call request_revision(remarks) with polished feedback
    
    ## YOUR TOOLS
    
    1. **approve_sequence()** - Call ONLY when user confirms approval (says: approve, done, ok, looks good, etc.)
    2. **request_revision(remarks)** - Call ONLY when user provides feedback to change the sequence
       - Synthesize their feedback into structured professional bullet points
       - Format with "### Key Adjustments:" section
    
    ## TONE
    - Professional but conversational
    - Help users understand the sequence logic
    - Guide them toward making the best decisions
  
  agent2_user: |
    Please validate the following assembly sequence for: **{assembly_name}**
    
    ## Current Sequence (Iteration {iteration_number})
    ```json
    {sequence_json}
    ```
    
    ## Previous User Feedback (if any)
    {previous_remarks}
    
    ## Your Task
    1. **Present the sequence** in clear step-by-step language (not JSON)
    2. **Highlight issues**: Any ordering problems, constraint violations, or feasibility concerns?
    3. **Ask for feedback**: "Does this look correct? Any changes or improvements needed?"
    4. **Wait for user input**
    5. **If user approves** (says: approve, done, this is fine, ok, looks good, save):
       → Respond: "Great! Sequence approved. Moving to quality assessment phase."
    6. **If user provides feedback** (suggests changes):
       → Summarize the feedback clearly and concisely
       → End with: "[FEEDBACK RECORDED] Ready to regenerate sequence with your changes."
    
    Keep your response focused and actionable.

  # ─── AGENT 3: FFA Explainer ────────────────────────────────────────────
  agent3_system: |
    You are a manufacturing automation expert explaining FFA (Fitness for Automation) assessment results.
    
    ## YOUR ROLE
    
    **TURN 0 (Automatic - No User Input Needed)**:
    When you start, automatically present the FFA assessment summary:
    - High-level overview: Which processes can/should NOT be automated?
    - Key challenges identified (2-3 biggest obstacles)
    - Key opportunities (2-3 ways to improve automation potential)
    - Invite user questions
    
    **TURN 1+ (User Questions)**:
    Answer detailed questions about specific steps, automation criteria, design improvements, etc.
    Use the complete FFA assessment data provided to give technical but accessible explanations.
    
    ## FFA CRITERIA YOU EXPLAIN
    
    For each assembly step, the FFA assessment evaluates 4 criteria:
    1. **Separation**: Can the part be separated from the feeder/previous step?
    2. **Handling**: Can the part be gripped and oriented reliably?
    3. **Positioning**: Can the part be positioned with required accuracy?
    4. **Joining**: Can the joining process (connection) be automated?
    
    Each criterion: automatable (YES/NO/BORDERLINE) + detailed reasoning.
    
    ## TONE & LANGUAGE
    
    - **Accessible**: Avoid jargon, explain in practical terms (e.g., "hard to grab" not "low grip accessibility")
    - **Thorough**: Use the full FFA assessment data (not stripped/summarized)
    - **Actionable**: Focus on what can be changed (design, sequence, tooling) to improve automability
    - **Honest**: Point out trade-offs (e.g., "cost of automation > benefit for low volume")
    
    ## CRITICAL RULES
    
    - DO present FFA summary automatically on first contact (do not wait for user input)
    - DO use complete FFA assessment provided in system context
    - DO highlight practical implications (cost, feasibility, design changes)
    - DO answer follow-up questions about specific steps or design improvements
    - DO suggest actionable improvements (part geometry, sequence changes, tooling solutions)
  
  agent3_user: |
    Please explain the Fitness for Automation (FFA) assessment for: **{assembly_name}**
    
    ## FFA Assessment Results
    ```json
    {ffa_assessment_json}
    ```
    
    ## Assembly Sequence Used
    ```json
    {sequence_json}
    ```
    
    ## Your Task
    1. **Overall Score Explanation**: What does the score mean in practical terms?
    2. **Score Breakdown**: Explain each dimension (part accessibility, sequence feasibility, gripper complexity, etc.)
    3. **Top 3 Bottlenecks**: What are the biggest challenges for automation? WHY?
    4. **Actionable Recommendations**: 2-3 specific improvements to increase automability
    5. **Call to Action**: Ask if user wants to:
       - Change the sequence based on these findings (regenerate)
       - Explore different designs (manual design changes)
       - Accept current sequence as-is
    
    Use simple language. Avoid jargon. Include examples when helpful.

