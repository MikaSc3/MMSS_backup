  monopart_analysis_task_v1:
    text: |
      Analyze this individual mechanical part from 3D renderings to assess its properties and automation potential.
      
      You will receive:
      - Multiple images of the SAME part (different views: top, isometric, etc.)
      - Optional JSON Metadata (stepparser part data: volume, bounding_box, etc.)
      - Optional Assembly Context (assembly overview from prior analysis)
      - Notice: The parts are colored for better visibility. Identical parts have identical colors. Colors do not correlate with material or other properties.

      Answer the following questions based on all images and data provided:

      material_and_mechanical_behavior:
        - What material is likely used?
        - Does the component contain sensitive functional surfaces?
        - Would it deform under typical gripping forces (20–50N)?
        - Are there thin walls, ribs, elastic zones?
        - Is it solid, brittle, ductile, elastic, or flexible?

      bulk_behavior:
        - Could parts interlock, hook, or entangle?
        - Could they nest into each other?
        - Do they stack naturally or chaotically?
        - Do they roll, tip, or lie stable on flat surfaces?
        - Are there protrusions or delicate features?
        - Is the part suitable for vibration feeding?
        - Can the part be gripped by a bin picking system?
        - Is manual separation from bulk required due to risks?
        - Explain mechanical reasons for each point.

