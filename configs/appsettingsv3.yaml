# The new STEP parser uses step_preprocessing below.
# Existing App V3 still uses configs/appconfig/appconfigV2.yaml.
# assembly_analysis remains a draft until that node is extracted.
workflow: assembly_assessment

nodes:
  step_preprocessing:
    color_mode: geometry
    rendering:
      enabled: true
      assembly_views: [iso1, iso4, front, top, right]
      part_views: [iso1, iso4, front, top, right]
      exploded_views: [iso1]
      highlighted_view: null
      transparency_values: [0.0]
      resolution: [1920, 1080]
      explosion_factor: 2.5
      edge_width: 1.0
      # Matte surfaces: 0 disables bright reflected highlights; range 0..1.
      material_specular: 0.0
      material_shininess: 0.1
      show_origin_axes: true
      origin_axes_size_ratio: 0.2
    spatial_relations:
      enabled: true
      contact_tolerance_mm: 0.01
      proximity_threshold_mm: 3.0
      distance_mode: all_pairs
    automaticimageselection:
      enabled: true
      include_exploded: false
      analysis_size: 128
      tile_size: [960, 540]
      assembly_entropy_weight: 0.15
    sam:
      enabled: false
      model_type: vit_b
      checkpoint: data/models/sam/sam_vit_b_01ec64.pth
      device: auto  # CUDA if available, otherwise CPU
      points_per_side: 32
      points_per_batch: 16
      pred_iou_thresh: 0.88
      stability_score_thresh: 0.95
      min_mask_region_area: 100
      overlay_alpha: 0.55
  assembly_analysis:
    enabled: true
    prompts:
      system: system_v1
      human: human_v1
    structured_output: assembly_analysis_v1
    model:
      id: "5.4"
    inputs:
      assembly_metadata:
        enabled: true
        fields: [total_parts, unique_parts, bounding_box]
      assembly_images:
        enabled: true
        views: [iso1, iso1_exploded]
        limit: 2
        downscale_factor: 0.7
