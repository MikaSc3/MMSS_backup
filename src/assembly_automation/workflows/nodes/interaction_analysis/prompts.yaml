  legacy_053_analyse_interaction_v2:
    role: human
    text: |-
      Analyze the mechanical interaction between the base part and the joining part for this assembly step.

      You will receive:
      - Rendered images of the assembly step (prior state and current state) also containing section views for better visibility.
      - Part metadata from the BOM
      - Section view of the interaction between the parts

      Base all reasoning strictly on visible geometry and provided metadata.
      Do not assume properties that are not shown.
      If a property cannot be determined and you make a guess, state this explicitly saying "my best guess is:".

      Fill the following fields:

      positioning_possibilities:
        - In what orientations could the joining part be placed onto/into the base part?
        - Assume a fixture is interacting with the part on the assembly table
        - For each case: what geometric features of base part or joining part support that placement?
        - Name 3 possibilities

      accuracy_of_target_position:
        - What translational and rotational precision is required for successful joining?
        - Base reasoning on fit type, alignment features, and contact surfaces visible in the images
        - What are the mechanical consequences of positional deviation?

      positioning_aids:
        - Describe the geometric interaction between base part and joining part
        - Are there features that assist alignment or centering (chamfers, tapers, fillets, shoulders, guide surfaces)?
        - How do these features mechanically guide or constrain movement during positioning?
        - Are chamfers present? Are endstops present?

      additional_orientation_by_rotation:
        - Is a defined angular orientation required between joining part and base part prior to joining?
        - Assess symmetry or asymmetry of geometry — name features that require angular orientation
        - What are the mechanical consequences of incorrect angular alignment?

      joining_tolerances:
        - Analyze dimensional relationships between base part and joining part
        - What is the most likely fit class in an industrial context (clearance, transition, interference)?
        - Describe mechanical sensitivity to tolerance variation

      accessibility_to_joining_position:
        - Evaluate geometric accessibility of the joining location
        - Describe possible approach directions, insertion depth, and required clearances
        - Note: the section view is not the normal operational state — imagine standing in front of the assembly
        - Is the joining motion visible and accessible, or is it blocked?

      joining_motion:
        - Describe the mechanically required joining motion (e.g., axial insertion, rotation, combined motion)
        - Specify constrained and free degrees of freedom during the motion
        - Base reasoning strictly on visible geometry

      stability_in_positioned_state:
        - Evaluate mechanical stability of the joining part once in its final position
        - Worst case: Assume the worst case orientation of the assembly. Would the joining part fall or change its position or orientation?
        - Best case: Assume the best case orientation of the assembly. Would gravity alone ensure correct position and orientation of the joining part?
        - Does geometry and fit provide self-holding, self-centering, or does it allow unintended movement?

      feeding_of_joining_element:
        - Is there an additional joining element required for this step that is NOT the base or joining part?
          (e.g., adhesive, lubricant) Note: Most screws, pins will be evaluated in the next step. Those are not required to be added here.
        - If yes: how could this element be fed to the process (manually or automatically)?

      fixing_of_mounted_part:
        - Describe the joining process between base part and joining part
          (e.g., thread engagement, friction fit, form-fit, bonding, riveting, screwing, press-fit)
        - How can this process be performed — what are manual and automated solutions?

      IMPORTANT: The structured output schema is enforced automatically. Focus on providing accurate, engineering-relevant analysis.
    legacy_id: Analyse_Interaction_V2
    source: configs/prompts.yaml#Analyse_Interaction_V2
    source_sha256: ca92c97052fc4ec6c5c65c93593163c89bf1f3b397e50529b693e3e49b625950
    status: historical_variant
