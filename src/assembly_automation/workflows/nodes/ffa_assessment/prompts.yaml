  legacy_061_ffa_assessment_task_v1_with_examples:
    role: human
    text: |-
      Assess this assembly step for automation feasibility across 4 key "Fitness for Automation" (FFA) categories.

      You will receive:
      1. Assembly step information (step description, base part, joining part, joining process)
      2. Metadata for base and joining parts (geometry, material, features)
      3. Multiple renderings: PRIOR step (assembly state BEFORE) + CURRENT step (assembly state AFTER)

      === CRITICAL EVALUATION LOGIC ===

      **SEPARATION**: For JOINING PART only

      **HANDLING**: For JOINING PART only

      **POSITIONING**: For the INTERACTION between parts

      **JOINING**: For the INTERACTION between parts

      === WORKFLOW (Reasoning-First Approach) ===

      For EACH category:
      1. ANALYZE: Review images (prior state vs current state), metadata, step description
      2. OPTIONS ANALYSIS: Write detailed analysis of ALL available options (3-7 sentences)
      3. REASON: Write specific justification for each selection (2-3 sentences)
      4. SELECT: Choose best option(s) from available options
      5. EVIDENCE: List supporting facts from metadata/images (optional)

          === CATEGORY 1: SEPARATION (Joining Part Only) ===


      nature_of_provision OPTIONS:
        - "in magazine (defined position and orientation)": Parts in trays or boxes with inlays
          -used for: Rods with bearing like tasks that would fall over without support and would roll when layed withouth inlays,Gears, high precision parts that need to be protected
        - "in magazine (without defined position or orientation)": One layer of parts in a box
          -used for: medium to big milled parts - rods, flanges,
        - "in magazine (packaging issues: individual packaging or sticky intermediate layer)"
          -used for: bearings,
        - "in magazine (with non-sticky intermediate layer)": Mutiple layers of parts in a box, divided by cartboard
          -used for:
        - "bulk cargo (easy to automated: e.g. spiral conveyors)"
          -used for: screws, nuts, bolts
        - "bulk cargo (automation with bin picking)":
          -used for: small milled or turned parts, without risk of entanglement and surfaces without special task
        - "bulk cargo (no automation possible: e.g. risk of catching)"
          -used for: Standard Springs, Small parts of high volume, often sheet metal or bended parts with latches, Sicherungsringe

        Important Notes: Do not choose what is best for automation. Chose what suits to the part and is cost effective in industrial context.

      options_analysis: Analyze ALL 7 options considering part geometry, size, tangling risk, stackability, cost
      reasoning: Explain your final choice
      evidence: List facts from metadata


      === CATEGORY 2: HANDLING (Joining Part Only) ===
      Assumption: We now assume the part seperated sucessfully (automated or by human does not matter) is laying in defined position and orientation (e.g. a little fixture)

      Focus: We need to evaluate how well the JOINING PART can be gripped.
      We need to evaluate some part traits as well.

      part_rigidity OPTIONS:
        - "rigid"
          - valid for: most parts in industrial use made of steel or plastics
        - "elastic"
          - valid for: elastomers, o rings,
        - "flexible"
          - valid for: foils, thin sheetmetal, cables

      gripping_areas OPTIONS:
        - "pronounced gripping area existing"
            - valid for: big and medium parts with a variety of possible big gripping areas such as: rods, flanges,
        - "small gripping area existing"
            - valid for: medium parts with small areas and small parts such as:
        - "no defined gripping area existing"
            - valid for:

        Use: all available Data and images to evaluate this

      orientation_features OPTIONS:
        - "mechanical self-adjustement in gripper possible": When the gripper closes the position and orientation of the part is defined.
          - examples: parts with circular features, edges and surfaces that can be used
        - "optical measurement in part delivery necessary": Because the parts lacks self-adjustment features or surfaces we need additional optical information.
          - examples:
        - "seperate aligning station necessary":
          - examples:
        - "no reference points for orientation": when the part has no grabable surfaces or features whatsoever
          - examples: cables

        Use: all available Data and images to evaluate this

      surface_sensibility OPTIONS:
        - "immune"
          - examples: Most industrial parts, important: if surfaces are important (bearings, rods, ...) we can assume the gripper has plastic components which protect the part
        - "easily scratched, easily broken, easily defomed": Applicable if scratches lead to a bad customer experience, or parts are actually brittle, easily broken or deformed
          - examples: Consumer electronic displays, Mirrors,

        Use: all available Data and images to evaluate this

      options_analysis: Analyze ALL handling aspects for the JOINING PART (4-6 sentences)
      {{criterion}}_reasoning: Explain selection for each criterion
      evidence: List facts from joining part metadata

      === CATEGORY 3: POSITIONING (Interaction Between Parts) ===

      Focus: How are parts ALIGNED and POSITIONED TOGETHER?

      **CRITICAL**: Evaluate the INTERACTION of the involved parts.

      When placing a part (first part of the assembly) we need to assume that the part is put in a fixture with chamfers and endstops
      After the part is positioned (by hand or robot) it is held by a fixture
      accuracy_of_target_position OPTIONS:
        - "base part position defined / joining point position defined": Base part is in a fixture, Joining position is defined.
          - examples: In most cases
        - "base part position defined / joining point position with tolerance": Base part is in a fixture but a critical feature needed for joining position might be under tolerance
          - examples: When features of parts must be aligned but their position or orientation in the fixture or gripper is not defined (rotational parts with single features like holes, slots, ...) Or when a gear needs to be inserted into an already placed one
        - "base part position with tolerance / joining point position defined": DONT USE
          - examples:
        - "base part position with tolerance / joining point position with tolerance": when the base part is to big for a fixture that can define its position
          - examples: big frames or structures when joining positions are not defined.

      positioning_aids OPTIONS: Refers to the interaction of both parts. if one part has the attribute, chose it.
        - "insertion chamfers and stopping edge": Either joining part or base part must have chamfers and an endstop
          - examples: Bushing (chamfers) is put onto a rod with a stoppind edge
        - "insertion chamfers"
          - examples: Bushing (no chamfers no edges) is put onto a rod with a fixed diameter (no stopping edges) but chamfers
        - "stopping edges"
          - examples: Bushing (no chamfers no edges) is put onto a rod with a stopping edge
        - "no positioning aids"
          - examples: Bushing (no chamfers no edges) is put on a rod with a fixed diamater (no chamfers, no stoppind edges)

      additional_orientation_by_rotation OPTIONS:
        - "not required": Joining part does not need additional rotational adjustment
          - examples: fully rotational pins / rods that are placed in circular holes
        - "mechanical guidance": Joining part needs additional rotational alginment with base part done by gripper (hard coded)
          - examples: Applicable to most joining parts which are not fully rotational symetric. A rectangular pin in a rectangular hole,Two rotational parts have holes that must be alligned, the base part and joining part have geometric features that must be aligned
        - "sensor-controlled": Joining part need additional rotational adjustment - there are no features that can help to mechanically orientate the parts. Sensor or vision solution required to get the orientation of the base part - joining part is then oriented based on the base parts orientation.
          - examples: Two rotational parts have holes that must be alligned, the parts themselves can rotate freely. Grippers need sensors to rotate the joining part until the holes align. Or: A gear must be inserted while another gear is already in place - position of placed gear needs to be known, then the joining part can be oriented accordingly.
        - "orientation necessary, but not possible" when joining part needs to be rotated according to the base part but info about the orientation of the base part or joining part cannot be measured by sensor / vision solutions
          - examples: Two rotational parts have holes that must be alligned. The hole of the joining part is blocked by the gripper itself and cannot be determined.

      accessibility_to_joining_position OPTIONS:
        - "visibility given / tool clearances given": Final Position is reachable without problems
          - examples:
        - "visibility limited / tool clearances given": Final Position is reachable but hardly visible
          - examples:
        - "visibility given / tool clearances limited": Final Position is visible but clearance is limited due to other parts
          - examples:
        - "visibility and tool clearances limited":
          - examples:

      positioning_motion OPTIONS:
        - "linear joining motion"
          - examples:
        - "joining motion with one degree of freedom"
          - examples:
        - "joining motion with multiple degrees of freedom"
          - examples:

      tolerances OPTIONS:
        - "+/- x mm": Base Part and Joining part have big play
          - examples:
        - "+/- 0.x mm": Base Part and Joining part have little play (most industrial use cases)
          - examples:
        - "0 clearance": Base Part and Joining part have 0 clearance
          - examples: Bearings on rods, bearings in housings, pins that act as bearings, sealing parts,
        - "adjustment of end position after assembly required"
          - examples: Sping loaded valves where spring load must be adjusted

      stability_in_positioned_state OPTIONS:
        - "stable, self-holding": After the Joining part is positioned, when we open the gripper the parts stays in place because there is place for a fixture or because parts interfer with another / hold each other
          - examples: Bearings on rods (press fit), parts that are inserted and held by surrounding parts
        - "holding during joining process required"
          - examples:

      options_analysis: Analyze ALL positioning aspects for INTERACTION (5-7 sentences)
      {{criterion}}_reasoning: Explain each selection
      evidence: List facts

      === CATEGORY 4: JOINING (Interaction Between Parts) ===

      Focus: How are parts CONNECTED/FASTENED? Are additional joining elements needed that are not listed in the step?

      **CRITICAL**: Evaluate the CONNECTION METHOD, not individual parts!

      feeding_of_joining_element OPTIONS: IMPORTANT: IF THE PART IS LISTED IN THE PARTS LIST; DO FEEDING IS NOT NEEDED TO BE ASSESST HERE!
        - "not necessary": When the base part and joining part do not need additional elements
          - examples: most cases
        - "automatable with standard solution":
          - examples: Feeding of lubricants, O-Rings, Fluid-Sealings
        - "limited feeding (e.g. accessibility)"
          - examples:
        - "automatable with special development"
          - examples:
        - "special development, not foreseeable"
          - examples:

      fixing_of_mounted_part OPTIONS:
        - "automatable with standard solution"
          - examples: When "Joining" means positioning a part, screwing or pressing bearings
        - "automatable with special development"
          - examples: Placement of retaining rings
        - "special development, not foreseeable"
          - examples:

      options_analysis: Analyze ALL joining aspects for CONNECTION (3-5 sentences)
      {{criterion}}_reasoning: Explain each selection
      evidence: List facts

      === IMPORTANT NOTES ===

      - **SEPARATION**: Only joining part
      - **HANDLING**: Only joining part
      - **POSITIONING**: Interaction between parts (always present)
      - **JOINING**: Interaction/connection (always present)

      - Select EXACTLY ONE option per field
      - Base assessment on THIS SPECIFIC STEP (not general part properties)
      - Use PRIOR step images to see assembly state BEFORE current operation
      - Use CURRENT step images to see assembly state AFTER current operation
      - Write options_analysis BEFORE selecting options (think first, classify second)

      === OUTPUT FORMAT ===

      Return structured JSON following FFA_Assessment_Complete schema.
      Include:
      - separation
      - handling
      - positioning (always present)
      - joining (always present)

      Each category has: options_analysis, selected option(s), specific reasoning, optional evidence list.
