  legacy_060_ffa_joining_v1:
    role: human
    text: |-
      You are evaluating the JOINING PROCESS category of the Fitness for Automation (FFA) assessment.
      This category assesses HOW THE PARTS ARE CONNECTED OR FASTENED TOGETHER.

      You are provided with:
        - Assembly step information
        - Base part metadata
        - Joining part metadata
