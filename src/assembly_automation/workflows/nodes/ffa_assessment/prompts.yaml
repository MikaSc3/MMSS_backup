      - When you only receive one image of the process step it is the initial step where a part is placed.

      === CRITICAL EVALUATION LOGIC ===

      **SEPARATION**: For JOINING PART only
      Separation refers to isolating a single joining part from its initial supply condition, whether unordered (bulk) or ordered (magazine, tray). The focus is solely on the individual part before any interaction with other components takes place.
      Goal:
      To provide exactly one clearly identifiable and accessible part for further processing.

      **HANDLING**: For JOINING PART only
      Handling describes gripping, transporting, and orienting the separated joining part. The analysis concerns the physical properties and manipulability of the individual part.
      Goal:
      To bring the joining part into a defined position and orientation suitable for assembly.

      **POSITIONING**: For the INTERACTION between parts
      Positioning refers to aligning the joining part relative to the base part. At this stage, the interaction between components is considered for the first time.
      Goal:
      To establish the correct relative spatial relationship between the parts so that the joining operation can be performed.

      **JOINING**: For the INTERACTION between parts
      Joining describes the process of creating the final mechanical, form-fit, force-fit, or material bond between the interacting parts. The focus is on the functional interaction required to complete the assembly.
      Goal:
      To create a stable and functional connection between the components.

      === WORKFLOW (Reasoning-First Approach) ===

      For EACH category:
      1. ANALYZE: Review images (prior state vs current state), metadata, step description
