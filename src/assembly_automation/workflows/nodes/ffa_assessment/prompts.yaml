  legacy_056_ffa_assessment_task_v1:
    role: human
    text: |-
      Assess this assembly step for automation feasibility across 4 key "Fitness for Automation" (FFA) categories.

      You will receive:
      1. Assembly step information (step description, base part, joining part, joining process)
      2. Metadata for base and joining parts (geometry, material, features)
      3. Multiple renderings: PRIOR step (assembly state BEFORE) + CURRENT step (assembly state AFTER)

      === CRITICAL EVALUATION LOGIC ===

      **SEPARATION**: For JOINING PART only

      **HANDLING**: For JOINING PART only

      **POSITIONING**: For the INTERACTION between parts

      **JOINING**: For the INTERACTION between parts

      === WORKFLOW (Reasoning-First Approach) ===

      For EACH category:
      1. ANALYZE: Review images (prior state vs current state), metadata, step description
      2. OPTIONS ANALYSIS: Write detailed analysis of ALL available options (3-7 sentences)
      3. REASON: Write specific justification for each selection (2-3 sentences)
      4. SELECT: Choose best option(s) from available options
      5. EVIDENCE: List supporting facts from metadata/images (optional)

      === CATEGORY 1: SEPARATION (Joining Part Only) ===

      Focus: How is the JOINING PART most likely supplied to the assembly station?


      nature_of_provision OPTIONS (select exactly ONE):
        - "in magazine (defined position and orientation)"
        - "in magazine (without defined position or orientation)"
        - "in magazine (packaging issues: individual packaging or sticky intermediate layer)"
        - "in magazine (with non-sticky intermediate layer)"
        - "bulk cargo (easy to automated: e.g. spiral conveyors)"
        - "bulk cargo (automation with bin picking)"
        - "bulk cargo (no automation possible: e.g. risk of catching)"

        Important Notes: Do not choose what is best for automation. Chose what suits to the part and is cost effective in industrial context.

      options_analysis: Analyze ALL 7 options considering part geometry, size, tangling risk, stackability, cost
      reasoning: Explain your final choice
      evidence: List facts from metadata


      === CATEGORY 2: HANDLING (Joining Part Only) ===

      Focus: We need to evaluate how well the JOINING PART can be gripped.
      We need to evaluate some part traits as well.

      part_rigidity OPTIONS:
        - "rigid"
        - "elastic"
        - "flexible"

      gripping_areas OPTIONS:
        - "pronounced gripping area existing"
        - "small gripping area existing"
        - "no defined gripping area existing"

        Use: all available Data and images to evaluate this

      orientation_features OPTIONS:
        - "mechanical self-adjustement in gripper possible"
        - "optical measurement in part delivery necessary"
        - "seperate aligning station necessary"
        - "no reference points for orientation"

        Use: all available Data and images to evaluate this

      surface_sensibility OPTIONS:
        - "immune"
        - "easily scratched, easily broken, easily defomed"

       Use: all available Data and images to evaluate this

      options_analysis: Analyze ALL handling aspects for the JOINING PART (4-6 sentences)
      {{criterion}}_reasoning: Explain selection for each criterion
      evidence: List facts from joining part metadata

      === CATEGORY 3: POSITIONING (Interaction Between Parts) ===

      Focus: How are parts ALIGNED and POSITIONED TOGETHER?

      **CRITICAL**: Evaluate the INTERACTION of the involved parts.

      accuracy_of_target_position OPTIONS:
        - "base part position defined / joining point position defined"
        - "base part position defined / joining point position with tolerance"
        - "base part position with tolerance / joining point position defined"
        - "base part position with tolerance / joining point position with tolerance"

      positioning_aids OPTIONS: Refers to the interaction of both parts. if one part has the attribute, chose it.
        - "insertion chamfers and stopping edge"
        - "insertion chamfers"
        - "stopping edges"
        - "no positioning aids"

      additional_orientation_by_rotation OPTIONS:
        - "not required"
        - "mechanical guidance"
        - "sensor-controlled"
        - "orientation necessary, but not possible"

      accessibility_to_joining_position OPTIONS:
        - "visibility given / tool clearances given"
        - "visibility limited / tool clearances given"
        - "visibility given / tool clearances limited"
        - "visibility and tool clearances limited"

      positioning_motion OPTIONS:
        - "linear joining motion"
        - "joining motion with one degree of freedom"
        - "joining motion with multiple degrees of freedom"

      tolerances OPTIONS:
        - "+/- x mm"
        - "+/- 0.x mm"
        - "0 clearance"
        - "adjustment of end position after assembly required"

      stability_in_positioned_state OPTIONS:
        - "stable, self-holding"
        - "holding during joining process required"

      options_analysis: Analyze ALL positioning aspects for INTERACTION (5-7 sentences)
      {{criterion}}_reasoning: Explain each selection
      evidence: List facts

      === CATEGORY 4: JOINING (Interaction Between Parts) ===

      Focus: How are parts CONNECTED/FASTENED? Are additional joining elements needed that are not listed in the step?

      **CRITICAL**: Evaluate the CONNECTION METHOD, not individual parts!

      feeding_of_joining_element OPTIONS: IMPORTANT: IF THE PART IS LISTED IN THE PARTS LIST; DO FEEDING IS NOT NEEDED TO BE ASSESST HERE!
        - "not necessary"
        - "automatable with standard solution"
        - "limited feeding (e.g. accessibility)"
        - "automatable with special development"
        - "special development, not foreseeable"

      fixing_of_mounted_part OPTIONS:
        - "automatable with standard solution"
        - "automatable with special development"
        - "special development, not foreseeable"

      options_analysis: Analyze ALL joining aspects for CONNECTION (3-5 sentences)
      {{criterion}}_reasoning: Explain each selection
      evidence: List facts

      === IMPORTANT NOTES ===

      - **SEPARATION**: Only joining part
      - **HANDLING**: Only joining part
      - **POSITIONING**: Interaction between parts (always present)
      - **JOINING**: Interaction/connection (always present)

      - Select EXACTLY ONE option per field
      - Base assessment on THIS SPECIFIC STEP (not general part properties)
      - Use PRIOR step images to see assembly state BEFORE current operation
      - Use CURRENT step images to see assembly state AFTER current operation
      - Write options_analysis BEFORE selecting options (think first, classify second)

      === OUTPUT FORMAT ===

      Return structured JSON following FFA_Assessment_Complete schema.
    legacy_id: ffa_assessment_task_v1
    source: configs/prompts.yaml#ffa_assessment_task_v1
    source_sha256: b0780904719495fe6d7a1b55c5580726e7e28b4eeee215b72c9e09b6e2c97f89
    status: historical_variant
  legacy_057_ffa_seperation_v1:
    role: human
    text: |-
      You are evaluating the PART PROVISIONING (Separation) category of the Fitness for Automation (FFA) assessment.
      This category assesses HOW THE JOINING PART IS SUPPLIED before assembly.

      You are provided with:
        - Assembly step information
        - Base part metadata
        - Joining part metadata
        - Step description and joining process
        - Images and interaction analysis (if available)

      Your task: Select the most appropriate `nature_of_provision` option based on the provided data and explain your choice.

      === CATEGORY 1: PART PROVISIONING ===

      nature_of_provision OPTIONS:
        - "magazine (defined position and orientation)": Each part is placed individually, with an exactly known position. Applicable to parts that need to be protected.
          - example: Shafts or rod-like parts with bearing-like function that would fall over without support and would roll away without inlays, gears, and high-precision parts that need to be protected.
        - "magazine (undefined position or orientation)": Parts are ordered, but twisted or not positionally fixed. For parts that do not require additional protection but are not suitable for bulk either.
          - example: Medium to large milled parts such as flanges and housings.
        - "magazine (packaging problem: individual packaging or sticky intermediate layer)": Parts are packed individually or stick to separating foils to protect them or lubricate them.
          - example: Roller bearings.
        - "magazine (with non-sticky intermediate layer)": Applicable for parts which can be stacked in multiple layers. Layers are separated by cardboard.
          - example: Medium to large milled parts such as flanges and housings that can be stacked.
        - "bulk (easily automatable: e.g. vibratory feeder)": Unordered, easy to separate, no risk of entanglement. Parts must be suitable for vibratory feeding. Vibratory feeders only for parts <50x50x50mm.
          - example: Screws, nuts, bolts, hexagonal nuts
        - "bulk (bin picking automatable)": Unordered, but can be picked with a 3D camera, no risk of entanglement. Applicable if parts do not require additional protection.
          - example: Small milled or turned parts without risk of entanglement and without function-critical surfaces.
        - "bulk (not automatable: e.g. entanglement)": Applicable when parts can entangled in bulk but magazined provision is unlikely due to part geometry or packaging costs.
          - example: Standard springs and small parts in high quantities, often sheet metal or bent parts with latching tabs, retaining rings.

      Guidelines:
        - IMPORTANT: The part must be suitable for the provision option.
        - Use bulk over magazined (cost and place effective)
        - Use vibration feed over bin picking (easier to automate)

      === OUTPUT ===
      Return a JSON object with keys:
      - options_analysis: Analyze pros/cons of the most relevant options (3-6 sentences)
      - nature_of_provision: string (exactly one of the options above)
      - reasoning: Explain your selection (1-2 sentences)
      - evidence: Optional list of facts from metadata/images

      Instructions:
      - Base all decisions strictly on provided data and renderings (if provided).
      - Select exactly one predefined option based on the provided data.
      - Output only the selected option strings.
    legacy_id: ffa_seperation_V1
    source: configs/prompts.yaml#ffa_seperation_V1
    source_sha256: ff2b1eb7bc0739a95eaf951d43c3d6a34dae3afbec82fc65b4a5fa72a8450536
    status: historical_variant
  legacy_058_ffa_handling_v1:
    role: human
    text: |-
      You are evaluating the PART HANDLING category of the Fitness for Automation (FFA) assessment.
      This category assesses HOW THE JOINING PART IS GRIPPED AND HANDLED before placement.

      You are provided with:
        - Assembly step information
        - Base part metadata
        - Joining part metadata
        - Step description and joining process
        - Images and interaction analysis (if available)

      Your task: Assess the joining part's handling characteristics across all 4 dimensions.

      === CATEGORY 2: PART HANDLING ===

      part_rigidity OPTIONS:
        - "rigid": No deformation when gripping.
          - example: Most industrial parts made of thermoplastics or metal.
        - "elastic": Yields, but returns to original shape.
          - example: Elastomers, O-rings.
        - "limp": Loses shape, buckles.
          - example: Cables, foils, thin, large sheet metal parts.

      gripping_areas OPTIONS:
        - "pronounced gripping areas present": Large surfaces or edges.
          - example: Medium to large milled parts such as flanges and housings with permissible gripping surfaces and edges that are not functional surfaces.
        - "small gripping areas present": When part has small surfaces or edges. (bbox <20 mm or fractioned surfaces)
          - example: Small parts (nuts and screws) with limited areas
        - "no gripping areas present": No surfaces.
          - example: Countersunk screws, retaining rings (no suitable gripping surfaces).

      orientation_features OPTIONS:
        - "self-alignment when gripper closes": Geometry enforces correct position in the gripper when closing.
          - example: Fully rotationally symmetric parts. Bearings, rods, Or when we handle a subassembly that is placed on the assembly table
        - "gripping based on part position detection required": Gripper must be adjusted to the current orientation of the part before gripping due to single features that position must be know before gripping.
          - example: Rotationally symmetric parts with keyway. Housings, Flanges. Actual position of the part or features must be known (edges, holes, ..) to securely grip the part.
        - "additional alignment station required": Vision solution is not sufficient or not possible. Mechanical alignment station defines the position before gripping.
          - example: Rotationally symmetric parts with keyway. Part is put on a orientation station where the key is matching the geometry of the fixture. When a gripper now takes the part we know its position!
        - "no orientation features": No mechanical features for orientation present.

      surface_sensitivity OPTIONS:
        - "insensitive": Mechanically robust.
          - example: Rotationally symmetric parts made of metal, housings.
        - "scratch, break, shape sensitive": Very sensitive.
          - example: Displays

      === OUTPUT ===
      Return a JSON object with keys:
      - options_analysis: Analyze gripping, rigidity, orientation features, surface sensitivity (3-6 sentences)
      - part_rigidity: string (one of the options above)
      - gripping_areas: string (one of the options above)
      - orientation_features: string (one of the options above)
      - surface_sensitivity: string (one of the options above)
      - reasoning: Explain your selections (1-2 sentences)
      - evidence: Optional list of facts from metadata/images

      Instructions:
      - Base all decisions strictly on provided data and renderings (if provided).
      - Select exactly one predefined option for each field based on the provided data.
      - Output only the selected option strings.
    legacy_id: ffa_handling_V1
    source: configs/prompts.yaml#ffa_handling_V1
    source_sha256: 7a0b66eb81222192255312f9bbfc583f85dd896b5fa65beef4149b12b5408a54
    status: historical_variant
  legacy_059_ffa_positioning_v1:
    role: human
    text: |-
      You are evaluating the JOINING LOCATION (Positioning) category of the Fitness for Automation (FFA) assessment.
      This category assesses THE SPATIAL POSITIONING AND JOINING of the joining part to the base part.

      You are provided with:
        - Assembly step information
        - Base part metadata
        - Joining part metadata
        - Step description and joining process
        - Images and interaction analysis (if available)

      Your task: Assess all positioning aspects and constraints.

      NOTE: When placing the first part of the assembly (only joining part, no base part), assume that the part is put in a fixture with chamfers and endstops. After the part is positioned it is held by the fixture.

      === CATEGORY 3: JOINING LOCATION ===

      accuracy_of_target_position OPTIONS:
        - "base part positioning defined / joining location defined": Base part in fixture (repeatable), joining position repeatably defined.
          - example: Placing the first parts in a fixture: housing in fixture, all joining positions defined. Applies to most cases!
        - "base part positioning defined / joining location tolerance": Base part in fixture (repeatable), joining position of other features varies.
          - example: The rotational basepart with a hole is placed in a fixture, now we add a pin to the Baseparts hole. We do not know where the hole is located at.
        - "base part positioning tolerance / joining location defined": Base part positioned via joining position in fixture, rotates freely around position.
          - example: The base parts fixture uses the hole (later joining position) to fix the part. Geometries around are having tolerances.
        - "base part positioning tolerance / joining location tolerance": In case no fixture possible. Everything varies.

      positioning_aids OPTIONS:
        - "insertion chamfers and end stops present": Base and joining part have at least one end stop and one insertion chamfer.
          - example: Bearing on shaft (shaft with insertion chamfer and end stop for bearing).
        - "insertion chamfers present": Base and joining part have at least one insertion chamfer.
          - example: Bearing on shaft (shaft with insertion chamfer, constant diameter – no end stop).
        - "end stops present": Base and joining part have at least one end stop.
          - example: Bearing on shaft (shaft with end stop for bearing, no insertion chamfer).
        - "no positioning aids present": Free joining.
          - example: Bearing on shaft – no insertion chamfer, no end stop.

      additional_orientation_by_rotation OPTIONS:
        - "not required": Orientation does not matter.
          - example: Rotationally symmetric pin in bore.
        - "mechanical guidance": Position controlled by gripper.
          - example: Place rectangular shaft in a rectangular cutout in the base part. Screwing
        - "optical information required": Positioning of the joining part must be based on optical information of the joining or base part.
          - example: Features of two parts must be detected by vision and matched (retaining pin must go into keyway of a rotational shaft).
        - "required but not feasible": Positioning must be based on optical information, but not possible.
          - example: Features must be detected and matched but not possible due to gripper blocking visibility or features too small.

      accessibility_to_joining_position OPTIONS:
        - "visibility and tool clearance given": Ideal case, location visible and accessible.
          - example: Free assembly area. Placing a part in a fixture.
        - "no visibility / tool clearance given": Blind assembly, location accessible, not visible.
          - example: Internal screw connection. Inserting components deeply in other ones.
        - "visibility given / no tool clearance": Location visible, but not accessible with gripper/tool.
          - example: Screw connection near housing wall (no accessibility for socket).
        - "no visibility / no tool clearance": Not visible, not accessible with gripper/tool.
          - example: Screw connection under cable.

      joining_motion OPTIONS:
        - "linear joining motion": One-dimensional movement.
          - example: Linear motion to put a basepart in a fixture.
        - "path movement required": Curved or at least 2D movement (screwing would be 2D - linear + rotation).
          - example: Screwing
        - "sensor guided (linear/path)": Force/path control or monitoring.
          - example: Pressing processes

      joining_tolerances OPTIONS:
        - "+/- x mm": Large clearance. +/- 1.0mm
          - example: For large assemblies and devices or parts with low precision requirements.
        - "+/- 0.x mm": Precise fit.
          - example: For most part pairings (spacer sleeve on shaft, parts placed in fixtures).
        - "zero clearance": Press fit.
          - example: Bearing on shaft, threaded inserts in housing.
        - "adjustment of end position after assembly required": Adjustment necessary.
          - example: Spring-loaded elements.

      stability_in_positioned_state OPTIONS:
        - "stable, self-holding": Part can be released after positioning/joining. Form or force fit holds parts.
          - example: Pressed-in elements, spacer sleeve threaded onto shaft.
        - "holding during joining process required": Part must be held in end position.

      === OUTPUT ===
      Return a JSON object with keys:
      - options_analysis: Analysis of alignment, positioning aids, tolerances, accessibility (4-7 sentences)
      - accuracy_of_target_position: string (one of the options above)
      - positioning_aids: string (one of the options above)
      - additional_orientation_by_rotation: string (one of the options above)
      - accessibility_to_joining_position: string (one of the options above)
      - joining_motion: string (one of the options above)
      - joining_tolerances: string (one of the options above)
      - stability_in_positioned_state: string (one of the options above)
      - reasoning: Explain your selections (1-2 sentences)
      - evidence: Optional list of facts from metadata/images

      Instructions:
      - Base all decisions strictly on provided data and renderings (if provided).
      - Maintain logical consistency across all positioning dimensions.
      - Select exactly one predefined option for each field based on the provided data.
      - Output only the selected option strings.
