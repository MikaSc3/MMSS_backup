  ffa_enum_options_with_explanations:
    role: human
    text: |-
      EXPLANATION LEVEL: WITH EXPLANATIONS (Values + Scope)
      Below are the FFA classification options with explanations of scope and applicability. For each field, understand the context and boundary conditions, then select the option that best matches your assessment:

      === CATEGORY 1: PART PROVISIONING ===
      nature_of_provision - Select EXACTLY ONE (do not paraphrase):
        - "in magazine (defined position and orientation)": Each part placed individually with exactly known position. Applicable to parts needing protection.
        - "in magazine (without defined position or orientation)": Parts ordered but not positionally fixed. For parts not requiring protection but unsuitable for bulk.
        - "in magazine (packaging issues: individual packaging or sticky intermediate layer)": Parts packed individually or stuck to separating foils for protection/lubrication.
        - "in magazine (with non-sticky intermediate layer)": Parts stackable in multiple layers with cardboard separation.
        - "bulk cargo (easy to automated: e.g. spiral conveyors)": Unordered, easy to separate, no entanglement risk. Suitable for vibratory feeding.
        - "bulk cargo (automation with bin picking)": Unordered but can be picked with 3D camera, no entanglement risk.
        - "bulk cargo (no automation possible: e.g. risk of catching)": Can entangle in bulk, manual separation required.

      === CATEGORY 2: PART HANDLING ===
      part_rigidity - Select EXACTLY ONE:
        - "rigid": No deformation when gripping. Most industrial parts made of thermoplastics or metal.
        - "elastic": Yields but returns to original shape. Elastomers, O-rings.
        - "flexible": Loses shape, buckles. Cables, foils, thin sheet metal parts.

      gripping_areas - Select EXACTLY ONE:
        - "pronounced gripping area existing": Large surfaces or edges available for gripping.
        - "small gripping area existing": Limited surfaces/edges (bbox <20mm or fractioned surfaces).
        - "no defined gripping area existing": No suitable gripping surfaces available.

      orientation_features - Select EXACTLY ONE:
        - "mechanical self-adjustement in gripper possible": Geometry enforces correct position when gripper closes. Rotationally symmetric parts, bearings, rods.
        - "optical measurement in part delivery necessary": Gripper must be adjusted based on current part orientation before gripping.
        - "seperate aligning station necessary": Vision solution insufficient. Mechanical alignment station defines position before gripping.
        - "no reference points for orientation": No mechanical features for orientation present.

      surface_sensibility - Select EXACTLY ONE:
        - "immune": Mechanically robust, not vulnerable to damage. Metal parts, housings.
        - "easily scratched, easily broken, easily defomed": Very sensitive to damage during handling.

      === CATEGORY 3: JOINING LOCATION ===
      accuracy_of_target_position - Select EXACTLY ONE:
        - "base part position defined / joining point position defined": Base part in fixture (repeatable), joining position repeatably defined. Most cases.
        - "base part position defined / joining point position with tolerance": Base position defined, joining position of other features varies.
        - "base part position with tolerance / joining point position defined": Base part positioned via joining location, rotates freely around position.
        - "base part position with tolerance / joining point position with tolerance": No fixture possible. Everything varies.

      positioning_aids - Select EXACTLY ONE:
        - "insertion chamfers and stopping edge": Both chamfers and end stops present. Always for first part of assembly/subassembly.
        - "insertion chamfers": Chamfers present but no end stops. Constant diameter without end stop.
        - "stopping edges": End stops present but no chamfers.
        - "no positioning aids": Free joining without geometric guidance.

      additional_orientation_by_rotation - Select EXACTLY ONE:
        - "not required": Orientation does not matter. Rotationally symmetric pin in bore.
        - "mechanical guidance": Geometry guides correct orientation. Position controlled by gripper.
        - "optical information necessary": Vision system needed to detect and match features before positioning.
        - "required but not feasible": Orientation needed but cannot be determined reliably. Vision insufficient or features too small.

      accessibility_to_joining_position - Select EXACTLY ONE:
        - "visibility given / tool clearances given": Ideal case. Location visible and accessible. Free assembly area.
        - "no visibility / tool clearances given": Blind assembly. Location accessible but not visible. Internal screw connections.
        - "visibility given / no tool clearances": Location visible but not accessible with gripper/tool. Screw near housing wall.
        - "no visibility / no tool clearances (e.g. blocked by cables, hoses etc.)": Not visible and not accessible. Screw under cable.

      positioning_motion - Select EXACTLY ONE:
        - "linear joining motion": One-dimensional movement. Linear motion to place base part in fixture.
        - "path motion necessary": Curved or 2D movement required. Screwing involves linear + rotation.
        - "sensor-guided (linear/path)": Force/path control or monitoring needed. Pressing processes.

      positioning_tolerances - Select EXACTLY ONE:
        - "+/- x mm": Large clearance approx ±1.0mm. For large assemblies or low precision requirements.
        - "+/- 0.x mm": Precise fit. Most part pairings (spacer sleeve on shaft, parts in fixtures).
        - "0 clearance": Press fit. Bearing on shaft, threaded inserts in housing.
        - "adjustment of end position after assembly required": Post-assembly adjustment necessary. Spring-loaded elements.

      stability_in_positioned_state - Select EXACTLY ONE:
        - "stable, self-holding": Part stays in position after joining. Form or force fit holds parts.
        - "holding during joining process required": Part must be held in end position during joining.

      === CATEGORY 4: JOINING PROCESS ===
      feeding_of_joining_element - Select EXACTLY ONE:
        - "not necessary": No additional parts required for the process. Most cases.
        - "automatable with standard solution": Standard component (adhesive, lubricant, rivets) required and automatable.
        - "limited feeding (e.g. accessibility)": Additional component needed but difficult to feed automatically.
        - "automatable with special development": Special geometry of rivets/screws requires custom solution.
        - "special development, not foreseeable": Experimental process not yet defined.

      fixing_of_mounted_part - Select EXACTLY ONE:
        - "automatable with standard solution": Standard solution (screw spindle, pressing in, clipping) applicable.
        - "automatable with special development": Special screws, gluing, retaining rings, custom solution needed.
        - "special development, not foreseeable": Experimental process not yet defined.
  ffa_enum_options_with_explaination_and_examples:
    role: human
    text: |-
      EXPLANATION LEVEL: FULL (Values + Explanations + Examples + Guidelines)
      Below are the FFA classification options with comprehensive explanations and practical examples. Study the examples carefully—they illustrate the boundary conditions. Use examples as reference points for you assessment:

      === CATEGORY 1: PART PROVISIONING ===
      nature_of_provision OPTIONS:
        - "in magazine (defined position and orientation)": Each part is placed individually, with an exactly known position. Applicable to parts that need to be protected.
          - example: Shafts or rod-like parts with bearing-like function that would fall over without support and would roll away without inlays, gears, and high-precision parts that need to be protected.
        - "in magazine (without defined position or orientation)": Parts are ordered, but twisted or not positionally fixed. For parts that to not require additional protection but are not suitable for bulk either.
          - example: Medium to large milled parts such as flanges and housings.
        - "in magazine (packaging issues: individual packaging or sticky intermediate layer)": Parts are packed individually or stick to separating foils to protect them or lubricate them.
          - example: Roller bearings.
        - "in magazine (with non-sticky intermediate layer)": Applicable for parts which can be stacked in multiple layers. Layers are separated by cardboard.
          - example: Medium to large milled parts such as flanges and housings that can be stacked.
        - "bulk cargo (easy to automated: e.g. spiral conveyors)": Unordered, easy to separate, no risk of entanglement. Parts must be suitable for vibratory feeding. Vibratory feeders only for parts <50x50x50mm.
          - example: Screws, nuts, bolts, hexagonal nuts
        - "bulk cargo (automation with bin picking)": Unordered, but can be picked with a 3D camera, no risk of entanglement. Applicable if parts do not require additional protection.
          - example: Small milled or turned parts without risk of entanglement and without function-critical surfaces.
        - "bulk cargo (no automation possible: e.g. risk of catching)": Applicable when parts can entangled in bulk but magazined provision is unlikely due to part geometry or packaging costs.
          - example: Standard springs and small parts in high quantities, often sheet metal or bent parts with latching tabs, retaining rings.

        Guidelines: IMPORTANT: The part must be suitable for the provision option. These guidelines are there if you are uncertain.
        - Use bulk over magazined (cost and place effective)
        - Use vibration feed over bin picking (easier to automate)

        After this we can assume:
        - The part is seperated from the bulk/cargo it was delivered in.
        - But: We still do not know its position / Orientation
        - If the parts are delivered in magazine (all variants) we can assume the parts orientation is defined but the position is not known (e.g. Basepart is placed on its bottom surface but we dont know its precise position or rotation)
        - If the parts are seperated by bin picking we either need camera or alignment station based on the parts geometry to pick it correctly.
        - In Case of Vibration feed we can assume the part is not only seperated but in a defined orientation and position
        - In case of not automatable: we can assume a human operator has placed the parts in an alignment station.
        - Important for evaluating the next category.

      === CATEGORY 2: PART HANDLING ===
      part_rigidity OPTIONS:
        - "rigid": No deformation when gripping.
          - example: Most industrial parts made of thermoplastics or metal.
        - "elastic": Yields, but returns to original shape.
          - example: Elastomers, O-rings.
        - "flexible": Loses shape, buckles.
          - example: Cables, foils, thin, large sheet metal parts.

      gripping_areas OPTIONS:
        - "pronounced gripping area existing": Large surfaces or edges.
          - example: Medium to large milled parts such as flanges and housings with permissible gripping surfaces and edges that are not functional surfaces.
        - "small gripping area existing": When part has small surfaces or edges. (bbox <20 mm or fractioned surfaces)
          - example: Small parts (nuts and screws) with limited areas
        - "no defined gripping area existing": No surfaces.
          - example: Countersunk screws, retaining rings (no suitable gripping surfaces).

      orientation_features OPTIONS:
        - "mechanical self-adjustement in gripper possible": Geometry enforces correct position in the gripper when closing.
          - example: Fully rotationally symmetric parts. Bearings, rods, Or when we handle a subassembly that is placed on the assembly table (first step of assembly)
        - "optical measurement in part delivery necessary": Gripper must be adjusted to the current orientation of the part before gripping due to single features that position must be known before gripping.
          - example: Rotationally symmetric parts with keyway. Housings, Flanges. Actual position of the part or features must be known (edges, holes, ..) to securely grip the part.
        - "seperate aligning station necessary": Vision solution is not sufficient or not possible. Mechanical alignment station defines the position before gripping.
          - example: Rotationally symmetric parts with keyway. Part is put on a orientation station where the key is matching the geometry of the fixture. When a gripper now takes the part we know its position! Also: Often used when vibration feeding or bin picking is used so part can be calibrated.
        - "no reference points for orientation": No mechanical features for orientation present.

      surface_sensibility OPTIONS:
        - "immune": Mechanically robust.
          - example: Rotationally symmetric parts made of metal, housings.
        - "easily scratched, easily broken, easily defomed": Very sensitive.
          - example: Displays

      After this we can assume:
      - The part is secure in a gripper or a hand of an operator. Important for evaluating the next category.


      === CATEGORY 3: JOINING LOCATION ===
      Notes: When placing the first part of the assembly (only joining part, no base part) we need to assume that the part is put in a fixture with chamfers and endstops
        After the part is positioned it is held by the fixture. So even if the joining part does not have chamfers and endstops, we can assume that is done by the fixture.

      accuracy_of_target_position OPTIONS:
        - "base part position defined / joining point position defined": Base part in fixture (repeatable), joining position repeatably defined.
          - example: Placing the first parts in a fixture: housing in fixture, all joining positions defined. Applies to most cases!
        - "base part position defined / joining point position with tolerance": Base part in fixture (repeatable), joining position of other features varies.
          - example: The rotational basepart with a hole is placed in a fixture, now we add a pin to the Baseparts hole. We do not know where the hole is located at.
        - "base part position with tolerance / joining point position defined": Base part positioned via joining position in fixture, rotates freely around position.
          - example: The base parts fixture uses the hole (later joining position) to fix the part. Geometries around are having tolerances.
        - "base part position with tolerance / joining point position with tolerance": In Case no fixture possible. Everything varies.
      positioning_aids OPTIONS:
        - "insertion chamfers and stopping edge": Base and joining part have at least one end stop and one insertion chamfer. Always applies to positioning the first part of an assembly or subassembly.
          - example: Bearing on shaft (shaft with insertion chamfer and end stop for bearing).
        - "insertion chamfers": Base and joining part have at least one insertion chamfer.
          - example: Bearing on shaft (shaft with insertion chamfer, constant diameter – no end stop).
        - "stopping edges": Base and joining part have at least one end stop.
          - example: Bearing on shaft (shaft with end stop for bearing, no insertion chamfer).
        - "no positioning aids": Free joining.
          - example: Bearing on shaft – no insertion chamfer, no end stop.
      additional_orientation_by_rotation OPTIONS:
        - "not required": Orientation does not matter.
          - example: Rotationally symmetric pin in bore.
        - "mechanical guidance": Position controlled by gripper.
          - example: Place rectangular shaft in a rectangular cutout in the base part (position of shaft hole must be ensured by rotation). Screwing
        - "optical information necessary": Positioning of the joining part must be based on optical information of the joining or base part.
          - example: Features of two parts must be detected by vision and matched (retaining pin must go into keyway of a rotational shaft. The position of the keyway varies). First: Orientation / Location of the hole must be identified. Then pin target position can be adjusted.
        - "required but not feasible": Positioning must be based on optical information, but not possible (not visible, measurable, etc.).
          - example: Features of two parts must be detected and matched (retaining pin must go into keyway of shaft, but keyway position not repeatable) – but not possible due to gripper blocking visibility or features too small
      accessibility_to_joining_position OPTIONS: Imagine you would stand in front of the assembly.
        - "visibility given / tool clearances given": Ideal case, location visible and accessible.
          - example: Free assembly area. Placing a part in a fixture.
        - "no visibility / tool clearances given": Blind assembly, location accessible, not visible.
          - example: Internal screw connection. Inserting components deeply in other ones.
        - "visibility given / no tool clearances": Location visible, but not accessible with gripper/tool.
          - example: Screw connection near housing wall (no accessibility for socket).
        - "no visibility / no tool clearances (e.g. blocked by cables, hoses etc.)": Not visible, not accessible with gripper/tool.
          - example: Screw connection under cable.
      positioning_motion OPTIONS: Meant is the final movement when placing the part in its final position.
        - "linear joining motion": One-dimensional movement.
          - example: Linear motion to but a basepart in a fixture.
        - "path motion necessary": Curved or at least 2D movement (screwing would be 2D - linear + rotation).
          - example: Screwing,
        - "sensor-guided (linear/path)": Force/path control or monitoring.
          - example: Pressing processes
      positioning_tolerances OPTIONS:
        - "+/- x mm": Large clearance. +- 1.0mm
          - example: For large assemblies and devices or parts with low precision requirements.
        - "+/- 0.x mm": Precise fit.
          - example: For most part pairings (spacer sleeve on shaft, parts placed in fixtures).
        - "0 clearance": Press fit.
          - example: Bearing on shaft, threaded inserts in housing.
        - "adjustment of end position after assembly required": Adjustment necessary.
          - example: Spring-loaded elements.
      stability_in_positioned_state OPTIONS:
        - "stable, self-holding": Part can be released after positioning/joining. Form or force fit holds parts.
          - example: Pressed-in elements, spacer sleeve threaded onto shaft.
        - "holding during joining process required": Part must be held in end position.

      === CATEGORY 4: JOINING PROCESS ===
      feeding_of_joining_element OPTIONS:
        - "not necessary": No additional parts required for the process.
          - example: Most cases.
        - "automatable with standard solution": Additional standard component (not present in step) required.
          - example: Adhesive, lubricant, etc., rivets.
        - "limited feeding (e.g. accessibility)": Additional standard component (not present in step) required, but difficult to feed automatically.
          - example: Adhesive, lubricant, etc., rivets in accessibility-limited locations.
        - "automatable with special development": Special geometry of rivets, screws, etc.
          - example: Special shapes of rivets, screws, etc.
        - "special development, not foreseeable": Experimental process.
      fixing_of_mounted_part OPTIONS:
        - "automatable with standard solution": Standard screw spindle, pressing in.
          - example: Standard screw connection, pressing in.
        - "automatable with special development": Special screws, gluing, fitting retaining rings.
          - example: Special screws, gluing, fitting retaining rings.
        - "special development, not foreseeable": Experimental process.
