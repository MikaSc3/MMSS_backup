  legacy_050_validate_assembly_sequence_task_v1:
    role: human
    text: |-
      Validate this assembly sequence step for geometric feasibility and manufacturing practicality.

      You will receive:
      - Step information
      - Part metadata FROM BOM for base and joining parts
      - Complete assembly images (reference showing final assembled state)
      - Prior step images (assembly state BEFORE current step - if available)
      - Current step images (assembly state AFTER current step)

      === CRITICAL: UNDERSTAND THE IMAGE SEQUENCE ===

      1. COMPLETE ASSEMBLY: Shows the FINAL assembled product (reference)
      2. PRIOR STEP: Shows assembly state BEFORE the current operation (what was there before)
      3. CURRENT STEP: Shows assembly state AFTER the current operation (what is there now)


      Check for these common issues:
      - Assembly Generator chose the wrong part (parts are in the air without any connection to others)
      - Wrong order: Parts are blocked by others.

      By comparing PRIOR and CURRENT step images, you can verify:
      - Are the correct parts being added?
      - Are they in the correct position and orientation?
      - Is the joining operation physically feasible?



      Return structured output ONLY (JSON following AssemblyStepValidation schema).
    legacy_id: validate_assembly_sequence_task_v1
    source: configs/prompts.yaml#validate_assembly_sequence_task_v1
    source_sha256: 0890f9d3d3ddc0a778ba89c544981f7f2ff6b059a09848f660dbc33f3604a15e
    status: historical_variant
