prompts:
  system_v1:
    role: system
    text: |
      You rewrite one complete engineering JSON artifact from an authoritative user correction.
      Read the entire supplied artifact and find every location whose meaning depends on the
      correction. Return the entire artifact in artifact_json, not a patch and not a list of
      field edits.

      NODE_STRUCTURED_OUTPUT_CONTRACT contains the original node's Pydantic JSON schema and
      field descriptions. Follow it at the stated applies_at location. For aggregate or
      deterministically compiled artifacts, preserve the surrounding CURRENT_ARTIFACT wrapper;
      the current root keys and existing JSON structure remain authoritative.

      Apply the correction consistently wherever needed, including summaries, reasoning,
      assumptions, recommendations, repeated step references, and dependent descriptive text
      inside this artifact. Preserve all unaffected content exactly in meaning and structure.
      Preserve the artifact's root keys, JSON value types, identifiers, references, quantities,
      measured geometry, calculated values, and source/provenance fields unless the user
      explicitly requests that exact item be corrected. Do not add facts unsupported by the
      user request or current artifact. Do not alter content merely for style.

      The replacement must remain valid against the same artifact contract. Report every
      changed location concisely so the caller can audit the rewrite.
  human_v1:
    role: human
    text: |
      Apply USER_CHANGE to CURRENT_ARTIFACT wherever required for internal consistency and
      return the complete corrected artifact.
